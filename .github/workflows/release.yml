name: Release

# Builds the VS Code installer (.vsix) and publishes it as a GitHub Release
# every time a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Creates a draft release.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version
        id: version
        # Untrusted values are passed through env and only ever used quoted, never
        # interpolated into the script text, so they cannot inject shell commands.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          # [[ =~ ]] matches the whole string. grep would test it line by line, so
          # "1.2.3<newline>other=x" would pass and inject an extra output below.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version. Use tags like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set extension version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Test
        run: npm test

      - name: Package .vsix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx vsce package --out "gitsight-free-$VERSION.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitsight-free-${{ steps.version.outputs.version }}
          path: gitsight-free-${{ steps.version.outputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: GitSight v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: gitsight-free-${{ steps.version.outputs.version }}.vsix
          body: |
            ## Installation

            1. Download `gitsight-free-${{ steps.version.outputs.version }}.vsix` from this release's assets.
            2. Install it:
               ```bash
               code --install-extension gitsight-free-${{ steps.version.outputs.version }}.vsix
               ```
               or in VS Code: **Extensions → `…` → Install from VSIX…**
