name: Release

# Builds the VS Code installer (.vsix) and publishes it as a GitHub Release
# every time a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0). Creates a draft release.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Use tags like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set extension version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Test
        run: npm test

      - name: Package .vsix
        run: npx vsce package --out "gitsight-${{ steps.version.outputs.version }}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitsight-${{ steps.version.outputs.version }}
          path: gitsight-${{ steps.version.outputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: GitSight v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: gitsight-${{ steps.version.outputs.version }}.vsix
          body: |
            ## Instalación

            1. Descarga `gitsight-${{ steps.version.outputs.version }}.vsix` de los archivos de esta release.
            2. Instálalo:
               ```bash
               code --install-extension gitsight-${{ steps.version.outputs.version }}.vsix
               ```
               o en VS Code: **Extensiones → `…` → Instalar desde VSIX…**
